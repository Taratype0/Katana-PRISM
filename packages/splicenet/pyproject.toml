[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splicenet"
version = "1.0.0"
description = "SpliceNet: Bulk Excess-BioVar debiased signed TOM co-splicing network and hub discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "dynamicTreeCut>=0.1.1",
    "matplotlib>=3.7",
]

[project.scripts]
splicenet = "splicenet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["splicenet*"]
