[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "katana-studio"
version = "1.0.1"
description = "Katana Studio & Katana Report: Self-contained SHA256-verified splicing synthesis report generator and interactive local workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dhruba Tara Maharjan", email = "dhruba.tara.maharjan@ki.se"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "dynamicTreeCut>=0.1.1",
    "networkx>=3.0",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "biopython>=1.81",
    "beautifulsoup4>=4.12",
    "reportlab>=4.0",
    "matplotlib-venn>=0.11",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "psutil>=5.9",
    "pydantic>=2.5",
    "fastapi>=0.109",
    "uvicorn>=0.27",
]

[project.scripts]
katana-studio = "katana_studio.cli:studio_main"
katana-report = "katana_studio.cli:report_main"
katana-cross-paradigm = "katana_studio.cross_paradigm:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["katana_studio*", "katana_next*"]

[tool.setuptools.package-data]
katana_next = [
    "_web/**/*",
    "_net_core/**/*",
    "_motif_core/**/*",
    "reports/assets/*",
    "resources/*",
    "vendor/**/*",
]
