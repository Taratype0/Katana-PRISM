[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splicemanifold"
version = "1.0.2"
description = "SpliceManifold: PS-DAS event qualification, Empirical-Bayes shrunk PSI Clustermap, PERMANOVA PCA, and Fisher-Precision Kernel Event-PSI UMAP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dhruba Tara Maharjan", email = "dhruba.tara.maharjan@ki.se"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5.5"]

[project.scripts]
splicemanifold = "splicemanifold.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["splicemanifold*"]
