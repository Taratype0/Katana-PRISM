[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scsplicenet"
version = "1.0.1"
description = "scSpliceNet: Single-cell Smart-seq3 donor-aware support-precision co-splicing network and module discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dhruba Tara Maharjan", email = "dhruba.tara.maharjan@ki.se"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "dynamicTreeCut>=0.1.1",
    "matplotlib>=3.7",
]

[project.scripts]
scsplicenet = "scsplicenet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scsplicenet*"]
