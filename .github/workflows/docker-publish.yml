name: Publish Katana-PRISM Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Katana-PRISM 1.0.1 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./containers/Dockerfile
          push: true
          tags: |
            ghcr.io/taratype0/katana-prism:1.0.1
            ghcr.io/taratype0/katana-prism:1.0.0
            ghcr.io/taratype0/katana-prism:latest
